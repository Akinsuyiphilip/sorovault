apiVersion: v1
kind: Service
metadata:
  name: {{ include "sorovault.fullname" . }}
  labels:
    {{- include "sorovault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sorovault.selectorLabels" . | nindent 4 }}